<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YATI-LMS</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        /* Stops catching taps the moment it starts to fade: visibility only
           turns hidden at the end of its 0.6s transition, so until then the
           first tap on the app underneath was swallowed. */
        pointer-events: none;
      }
      #splash-screen img {
        /* The YATICORP mark is a wide wordmark (~4.6:1), so it is sized by
           width and left to keep its own aspect ratio rather than being
           letterboxed inside a square. */
        width: 280px;
        max-width: 70vw;
        height: auto;
        object-fit: contain;
        animation: splashPulse 1.5s ease-in-out infinite;
      }
      #splash-screen p {
        margin-top: 20px;
        color: #a78bfa;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: splashFade 1.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes splashFade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
    <!--
      The language chosen (the menu beside the bell): when it is not English,
      the page is kept hidden for a moment until it is translated, so it never
      shows in English first.
    -->
    <style>html.yati-tx-hide #root { opacity: 0 !important; } #root { transition: opacity .15s ease; }</style>
    <script>
      (function () {
        var lang = 'en';
        try { lang = localStorage.getItem('yati-language') || 'en'; } catch (e) {}
        if (lang === 'hi' || lang === 'kn') {
          document.documentElement.classList.add('yati-tx-hide');
          // Shown anyway after 2.5 s, should the translations be slow to load.
          setTimeout(function () { document.documentElement.classList.remove('yati-tx-hide'); }, 2500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/assets/YATICORP.png" alt="YATICORP" />
      <p>Loading...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.hideSplash = function () {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 700);
        }
      };
    </script>
  </body>
</html>
