<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YATI-LMS</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash-screen img {
        /* The YATICORP mark is a wide wordmark (~4.6:1), so it is sized by
           width and left to keep its own aspect ratio rather than being
           letterboxed inside a square. */
        width: 280px;
        max-width: 70vw;
        height: auto;
        object-fit: contain;
        animation: splashPulse 1.5s ease-in-out infinite;
      }
      #splash-screen p {
        margin-top: 20px;
        color: #a78bfa;
        font-family: 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: splashFade 1.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes splashFade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/assets/YATICORP.png" alt="YATICORP" />
      <p>Loading...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.hideSplash = function () {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function () { splash.remove(); }, 700);
        }
      };
    </script>
  </body>
</html>
